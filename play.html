<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden !important; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    ruffle-player { width: 100% !important; height: 100% !important; }
  </style>
  <script src="https://unpkg.com"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { "autoplay": "on", "unmuteOverlay": "hidden", "letterbox": "on" };
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("game-container").appendChild(player);
      player.load("jsdelivr.net");
    });
  </script>
</body>
</html>
