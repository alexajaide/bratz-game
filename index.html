<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bratz Game Player</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        #game-container { width: 100%; height: 100%; }
    </style>
    <!-- Load Ruffle Emulator -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="game-container"></div>
<script>
    window.RufflePlayer = window.RufflePlayer || {};
    // This forces Ruffle to scale nicely and wait for user clicks gracefully
    window.RufflePlayer.config = {
        "autoplay": "on",
        "unmuteOverlay": "visible"
    };

    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";
        document.getElementById("game-container").appendChild(player);
        
        // DOUBLE CHECK: Ensure this matches your exact filename case on GitHub!
        player.load("bratzgirlsbeautysalon.swf"); 
    });
</script>
</body>
</html>
